const DATA={"case": [["Company", "Litware, Inc. is a medium-sized finance company with its main office in Boston.", "03.png;04.png"], ["Identity", "The on-premises Litware.com Active Directory forest is linked to the Litware.com Microsoft Entra tenant. All users have Entra ID P2. A second tenant, dev.Litware.com, is used for development. Existing capolicy1 requires production portal management from a hybrid Entra joined device.", "05.png"], ["Azure subscriptions", "10 Azure subscriptions are linked to Litware.com and five to dev.Litware.com. All are in an Enterprise Agreement. Custom role Role1 in the Litware.com tenant grants Storage DataActions read permission.", "06.png"], ["On-premises servers", "SERVER1, SERVER2 and SERVER3 are Ubuntu 18.04 VMs hosted on Hyper-V. They host App1, which uses Hadoop-compatible external storage and POSIX file-level ACLs. SERVER10 runs Windows Server 2016 and SQL Server with databases DB1 and DB2.", "07.png;08.png;09.png"], ["Connectivity", "ExpressRoute connectivity to Azure is already configured.", "10.png"], ["Planned migration", "Migrate DB1 and DB2 to Azure; migrate App1 to Azure VMs placed on Azure Dedicated Hosts.", "11.png"], ["Identity / access requirements", "Production Azure portal management requires hybrid-joined devices and MFA; use Network Contributor for all VNets in both tenants; App1 must use the hosting VM managed identity; apply custom Role1 to all Azure Storage accounts. Assign RBAC roles at the highest feasible scope.", "12.png"], ["Resilience", "DB1/DB2: remain available if two local-region availability zones fail, fail over automatically, and minimize I/O latency. App1: region with availability zones, VM automatic scale-out, and retain availability after two local availability zones fail.", "13.png;14.png"], ["Security / compliance", "New App1 data must be writable but existing/new data cannot subsequently be modified for three years; on-premises clients must access App1 storage; block storage public endpoint; enable SQL TDE; no physical host sharing for App1.", "14.png;15.png"], ["Business", "Minimize administration and cost.", "16.png"]], "questions": [{"n": 1, "type": "Single choice", "topic": "Immutable storage", "stem": "After migrating App1 to Azure, enforce the data-modification requirements described in Litware’s security and compliance requirements. What should you do?", "options": ["A. Create Azure RBAC assignments.", "B. Create an access policy for the blob service.", "C. Modify the access level of the blob service.", "D. Implement Azure resource locks."], "answer": "B", "status": "Reasoned", "confidence": "High", "rationale": "A time-based immutable blob retention policy (WORM) prevents protected blobs from being changed or deleted while still allowing the creation of new blobs. Set an appropriate three-year retention period and lock the policy after validation; RBAC, public access level and management locks do not impose WORM data immutability.", "caveat": "The source’s “access policy” wording refers to the storage container/blob immutability policy, not an Azure RBAC policy.", "links": ["https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview"], "screenshot": [17]}, {"n": 2, "type": "Hotspot", "topic": "Azure SQL high availability", "stem": "Migrate DB1 and DB2 to Azure. Select the database service and service tier that meet the resiliency and performance requirements.", "options": ["Database: Single Azure SQL database / Azure SQL Managed Instance / Azure SQL Database elastic pool", "Tier: Hyperscale / Business Critical / General Purpose"], "answer": "Azure SQL Managed Instance; Business Critical (provisional)", "status": "Architectural conflict", "confidence": "Medium", "rationale": "A Managed Instance hosts multiple SQL databases with SQL Server compatibility. The Business Critical tier uses local SSDs and provides low I/O latency and replica-based automatic failover; enable zone redundancy.", "caveat": "The requirement to survive the simultaneous loss of TWO of the THREE availability zones in one region is not guaranteed by the zone-redundant Business Critical SLA. Extra cross-region failover / continuity design is needed; the pictured dropdowns cannot fully guarantee the exact stated requirement.", "links": ["https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/high-availability-sla-local-zone-redundancy", "https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview"], "screenshot": [18]}, {"n": 3, "type": "Single choice", "topic": "Azure RBAC", "stem": "Implement Network Contributor Azure RBAC access across all Azure virtual networks in the subscriptions described by the case. What is the MINIMUM number of role assignments?", "options": ["A. 1", "B. 2", "C. 5", "D. 10", "E. 15"], "answer": "B — 2", "status": "Reasoned", "confidence": "High", "rationale": "The 10 production subscriptions and five development subscriptions belong to TWO different Microsoft Entra tenants, each with its own management-group hierarchy. Assign Network Contributor once at each tenant’s appropriate top management-group scope.", "caveat": "Apply root management-group privileges only if organizational policy permits; this follows the case instruction to assign at the highest scope.", "links": ["https://learn.microsoft.com/en-us/azure/governance/management-groups/overview", "https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments"], "screenshot": [19]}, {"n": 4, "type": "Hotspot", "topic": "Azure SQL high availability", "stem": "How should the migrated databases DB1 and DB2 be implemented in Azure? Select database model and service tier.", "options": ["Database: Single Azure SQL database / Azure SQL Managed Instance / Azure SQL Database elastic pool", "Tier: Hyperscale / Business Critical / General Purpose"], "answer": "Azure SQL Managed Instance; Business Critical (provisional)", "status": "Architectural conflict", "confidence": "Medium", "rationale": "This repeats Case Study Q2 with slightly different wording and answer-area formatting. Managed Instance + Business Critical is the likely intended exam combination because of two databases, low I/O latency, zone redundancy and automatic failover.", "caveat": "As with Q2, no listed combination independently guarantees survival of TWO AZ failures in the same Azure region.", "links": ["https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/high-availability-sla-local-zone-redundancy"], "screenshot": [20]}, {"n": 5, "type": "Single choice", "topic": "Immutable storage", "stem": "After migrating App1, ensure the storage complies with the three-year data-modification requirement. What should you do?", "options": ["A. Create an access policy for the blob.", "B. Modify the access level of the blob service.", "C. Implement Azure resource locks.", "D. Create Azure RBAC assignments."], "answer": "A", "status": "Reasoned", "confidence": "High", "rationale": "This is substantially the same as Q1 with shuffled choices. A time-based WORM retention policy addresses modification and deletion prevention.", "caveat": "The desired 3-year retention and treatment of new blobs must be configured explicitly.", "links": ["https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-container-level-worm-policies"], "screenshot": [21]}, {"n": 6, "type": "Hotspot", "topic": "ADLS Gen2 storage", "stem": "Choose the storage account type and configuration that support App1’s Hadoop-compatible filesystem and POSIX-style ACL requirements.", "options": ["Storage type: Premium page blobs / Premium file shares / Standard general-purpose v2", "Configuration: NFSv3 / Large file shares / Hierarchical namespace"], "answer": "Standard general-purpose v2; Hierarchical namespace", "status": "Reasoned", "confidence": "High", "rationale": "Hierarchical namespace enables ADLS Gen2 filesystem semantics and POSIX-like access control lists, matching the App1 source storage. GPv2 supports this setting.", "caveat": "For the three-year WORM requirement, use a supported container-level immutability policy on the HNS-enabled account; version-level WORM is not supported with HNS.", "links": ["https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-access-control", "https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-container-level-worm-policies"], "screenshot": [22]}, {"n": 7, "type": "Hotspot", "topic": "Migration economics", "stem": "For App1, choose the tool to estimate migration costs and the method to minimize steady-state compute costs while meeting the dedicated-host requirement.", "options": ["Estimate: Azure Advisor / Azure Cost Management Power BI app / Azure Total Cost of Ownership (TCO) calculator", "Implement: Azure Reservations / Azure Hybrid Benefit / Azure Spot Virtual Machine pricing"], "answer": "Azure TCO calculator; Azure Reservations", "status": "Reasoned", "confidence": "High", "rationale": "The TCO calculator compares planned on-premises versus Azure economics. Reservation pricing can reduce the cost of long-running Azure Dedicated Host capacity. Spot is interruptible and cannot be relied on for the HA design.", "caveat": "For a current budgeting exercise, Azure Pricing Calculator is also relevant, but it is not an offered option.", "links": ["https://learn.microsoft.com/en-us/azure/virtual-machines/dedicated-hosts", "https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator"], "screenshot": [23]}, {"n": 8, "type": "Hotspot", "topic": "Dedicated Hosts & VMSS", "stem": "Select the minimum number of Dedicated Host groups and VM scale sets for App1’s autoscaling and availability-zone resiliency requirements.", "options": ["Host groups: 1 / 2 / 3 / 6", "Virtual machine scale sets: 0 / 1 / 3"], "answer": "3 host groups; 3 VM scale sets", "status": "Reasoned", "confidence": "Medium", "rationale": "A dedicated host group is zonal; use one host group in EACH of three zones. With the documented dedicated-host VMSS requirement that a scale set and its host group use the same zone, the matching design uses one zonal scale set per host group.", "caveat": "Sufficient dedicated host spare capacity, load balancing and scale-out configuration are still essential. This is a minimum architecture pattern from the offered choices, not an SLA that two AZ outages can always be survived.", "links": ["https://learn.microsoft.com/en-us/azure/virtual-machines/dedicated-hosts", "https://learn.microsoft.com/en-us/azure/virtual-machines/dedicated-hosts/how-to"], "screenshot": [24]}, {"n": 9, "type": "Order list", "topic": "Azure Policy for SQL TDE", "stem": "Arrange the actions to configure Azure Policy so existing production SQL databases have Transparent Data Encryption (TDE) enabled.", "options": ["Create a policy definition that uses deployIfNotExists", "Create a user-assigned managed identity", "Invoke a remediation task", "Create an Azure policy assignment", "Create a policy definition that uses Modify"], "answer": "1. DeployIfNotExists policy definition → 2. Policy assignment → 3. Remediation task", "status": "Reasoned", "confidence": "High", "rationale": "DeployIfNotExists can deploy missing TDE settings. Assign the policy with an identity and sufficient roles, then start remediation for existing noncompliant databases. A separate user-assigned identity is not mandatory because the policy assignment may use system-assigned identity.", "caveat": "Azure has a built-in policy for deploying SQL TDE; a custom definition is needed only if the case specifically requires it.", "links": ["https://learn.microsoft.com/en-gb/azure/governance/policy/concepts/effect-deploy-if-not-exists", "https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources"], "screenshot": [25]}, {"n": 10, "type": "Single choice", "topic": "Managed identities", "stem": "After migrating App1 to Azure virtual machines, what endpoint should the app call to obtai let idx=0,show=false;const notes=JSON.parse(localStorage.getItem('az305_litware_notes_v1')||'{}');const studied=JSON.parse(localStorage.getItem('az305_litware_done_v1')||'{}');const selections=JSON.parse(localStorage.getItem('az305_litware_selections_v1')||'{}');const saveSelection=()=>localStorage.setItem('az305_litware_selections_v1',JSON.stringify(selections));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=DATA.questions[idx];document.getElementById('count').textContent=(idx+1)+' / '+DATA.questions.length;document.getElementById('toggle').textContent=show?'Hide answer':'Reveal answer';document.getElementById('card').innerHTML=`<div class="tag">Q${q.n} · ${esc(q.type)} · ${esc(q.topic)}</div><h2 style="margin-top:14px">${esc(q.stem)}</h2><div class="options">${q.type==="Hotspot"?q.options.map((o,k)=>{const parts=o.split(": ");const candidates=(parts[1]||"").split(" / ");return `<label class="opt answer-choice"><span>${esc(parts[0])}</span><select class="answer-select" data-slot="${k}" aria-label="${esc(parts[0])}"><option value="">Choose an answer</option>${candidates.map(v=>`<option value="${esc(v)}" ${((selections[q.n]||[])[k]===v)?"selected":""}>${esc(v)}</option>`).join("")}</select></label>`}).join(""):q.type==="Order list"?`<p class="note">Select the steps in the correct order. Click a selected step again to remove it.</p>${q.options.map((o,k)=>`<button type="button" class="opt answer-order" data-index="${k}"><span class="order-rank">${(selections[q.n]||[]).indexOf(k)>=0?(selections[q.n]||[]).indexOf(k)+1:"—"}</span>${esc(o)}</button>`).join("")}`:q.options.map((o,k)=>`<label class="opt answer-choice"><input type="radio" name="answer-choice" value="${k}" ${(selections[q.n]===k)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div><div class="controls"><label><input type="checkbox" id="done" ${studied[q.n]?'checked':''}> Studied</label><span class="tag">${esc(q.status)} · ${esc(q.confidence)}</span></div>${show?`<section class="res ${q.status==='Architectural conflict'?'warn':''}"><b>Recommended answer:</b> ${esc(q.answer)}</section><h3>Architect rationale</h3><p class="note">${esc(q.rationale)}</p><h3>Qualification</h3><p class="note warn">${esc(q.caveat)}</p><div class="refs">${q.links.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('')}</div>`:''}<details><summary>Personal notes (saved locally)</summary><textarea id="notes" placeholder="What do you need to revise?">${esc(notes[q.n]||'')}</textarea></details>`;document.querySelectorAll('input[name="answer-choice"]').forEach(el=>el.onchange=()=>{selections[q.n]=Number(el.value);saveSelection()});document.querySelectorAll('.answer-select').forEach(el=>el.onchange=()=>{const v=Array.isArray(selections[q.n])?[...selections[q.n]]:[];v[Number(el.dataset.slot)]=el.value;selections[q.n]=v;saveSelection()});document.querySelectorAll('.answer-order').forEach(el=>el.onclick=()=>{const k=Number(el.dataset.index);const v=Array.isArray(selections[q.n])?[...selections[q.n]]:[];const at=v.indexOf(k);if(at>=0)v.splice(at,1);else v.push(k);selections[q.n]=v;saveSelection();render()});document.getElementById('done').onchange=e=>{studied[q.n]=e.target.checked;localStorage.setItem('az305_litware_done_v1',JSON.stringify(studied))};const box=document.getElementById('notes');box&&box.addEventListener('input',e=>{notes[q.n]=e.target.value;localStorage.setItem('az305_litware_notes_v1',JSON.stringify(notes))});document.getElementById('qnav').innerHTML=DATA.questions.map((t,j)=>`<button class="qn ${j===idx?'active':''}" data-n="${j}">${t.n}</button>`).join('');document.querySelectorAll('.qn').forEach(el=>el.onclick=()=>{idx=+el.dataset.n;show=false;render()})}
function change(delta){idx=(idx+delta+DATA.questions.length)%DATA.questions.length;show=false;render()};document.getElementById('next').onclick=()=>change(1);document.getElementById('prev').onclick=()=>change(-1);document.getElementById('toggle').onclick=()=>{show=!show;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')change(1);if(e.key==='ArrowLeft')change(-1);if(e.key===' '){e.preventDefault();show=!show;render()}});
document.getElementById('caseinfo').innerHTML=DATA.case.map((c,j)=>`<section class="context"><h4>${esc(c[0])}</h4><p>${esc(c[1])}</p></section>`).join('');render();
</script></body></html>
