<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export AZ-305 progress</title><style>body{font:18px/1.6 system-ui;max-width:760px;margin:40px auto;padding:20px}button{font:inherit;padding:12px}</style><h1>Export your AZ-305 progress</h1><p>Open this page on the same address and browser as your old study guide. Export before moving to the independent platform. The file includes cue-card answers, attempts, case-study selections and notes. Keep it private. Your old progress stays here.</p><button id="export">Download progress backup</button><p id="status" role="status"></p><p><a href="../az305-study-guide/">Return to study guide</a></p><script type="module">import {exportBackup} from './progress-core.js';document.querySelector('#export').onclick=()=>{try{const data=exportBackup(localStorage);if(!Object.keys(data.data).length){document.querySelector('#status').textContent='No saved AZ-305 progress found on this origin. Check the address and browser you used to study.';return;}const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='az-305-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Export complete. Import this file on the new platform.';}catch{document.querySelector('#status').textContent='Export failed. Browser storage may be blocked or malformed.';}};</script></html>
